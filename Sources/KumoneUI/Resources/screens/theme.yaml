# "Vinyl night" — the default theme. The brief: a night-listening player,
# so the palette is a slate-blue black (a coloured darkness, not dead
# #000), text in two contrast-safe steps, and one low-saturation amber
# accent reserved for the living thing on screen (the play glyph, the seek
# fill, the active lyric). Everything else stays quiet so the cover art
# carries the page.
#
# Spacing is the 8pt grid (8 / 16 / 24), radii nest (chrome 16, inlaid art
# 8 = outer minus its gap), and the type scale is the minor third (11, 13,
# 16, 19) — hierarchy by weight and colour first, size second.

tokens:
  canvas:    "#12151C"
  surface:   "#1B2029"
  text:      "#EDEFF2"
  textSub:   "#8B93A1"
  accent:    "#D8A657"
  hairline:  "#2A303B"

styles:
  chrome:
    background: token(canvas)
    cornerRadius: 16
    padding: 24

  # A translucent panel stacked over the backdrop cover: the material
  # that keeps text readable on imagery. 8-digit hex carries the alpha.
  glass:
    background: "#06080DB0"
    cornerRadius: 16
    padding: 24

  # Type scale, minor third: 11 / 13 / 16 / 19. Contrast checked against
  # the canvas: textSub 5.9:1, the dimmed lyric 5.25:1 (4.5 is the floor
  # for body-size text; the old #6E7684 measured 4.0 and went out).
  title:         { color: token(text),    fontSize: 19, fontWeight: semibold }
  meta:          { color: token(textSub), fontSize: 13 }
  caption:       { color: token(textSub), fontSize: 11 }
  rowTitle:      { color: token(text),    fontSize: 13 }
  rowMeta:       { color: token(textSub), fontSize: 11 }
  lyricActive:   { color: token(text),    fontSize: 16 }
  lyricInactive: { color: "#828A98",      fontSize: 16 }

  # One accent, reserved: the playing glyph, the seek fill, the live
  # lyric, and navigation. Nothing else is loud.
  seek:          { color: token(accent) }
  transportMain: { color: token(accent) }
  transportSide: { color: token(textSub) }
  nav:           { color: token(accent), fontSize: 11 }

  # Type on top of imagery: full values stay as-is, but the dimmed steps
  # are translucent white so they survive the cover.
  onArtDim:      { color: "#FFFFFFAA", fontSize: 11 }
  onArtMeta:     { color: "#FFFFFFCC", fontSize: 13 }

  # The primary transport key: a filled disc, dark glyph — the one loud
  # object on the page after the cover itself.
  transportKey:  { background: "#F2F2F5", color: "#141821" }
