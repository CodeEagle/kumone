# The lyrics screen — the sheet floats over its own cover. Of the three
# screens this one dims the most, because a whole column of small text
# has to read on top of imagery.

window:
  width: 400
  height: 620
  minWidth: 344
  minHeight: 480
  title: Lyrics

root:
  type: ZStack
  children:
    - type: BackdropArtwork
      url: ${player.artworkURL}
      blur: 40
      dim: 0.62
      cornerRadius: 16

    - type: Container
      class: [glass]
      children:
        - type: VStack
          spacing: 20
          alignment: leading
          children:
            - type: HStack
              spacing: 12
              alignment: center
              children:
                - type: Artwork
                  url: ${player.artworkURL}
                  size: 44
                  cornerRadius: 6
                - type: VStack
                  spacing: 4
                  alignment: leading
                  children:
                    - type: Text
                      class: [title]
                      text: ${player.title}
                    - type: Text
                      class: [onArtMeta]
                      text: ${player.artist}

            - type: HStack
              spacing: 12
              alignment: center
              children:
                - type: Text
                  class: [onArtDim]
                  text: ${player.progressClock}
                - type: ProgressSlider
                  class: [seek]
                  value: ${player.progress}
                  duration: ${player.duration}
                  action: player.seek
                - type: Text
                  class: [onArtDim]
                  text: ${player.durationClock}

            # The sheet: every line, the current one lit. Over imagery
            # the dimmed steps brighten a step so the contrast floor
            # survives the backdrop.
            - type: LyricView
              lines: ${lyrics.lines}
              currentIndex: ${lyrics.currentIndex}
              activeColor: "#FFFFFF"
              inactiveColor: "#FFFFFF80"
              alignment: center
              fontSize: 16

            - type: HStack
              spacing: 44
              alignment: center
              children:
                - type: Button
                  action: player.previous
                  children:
                    - type: Icon
                      class: [onArtDim]
                      name: backward.fill
                      size: 18
                - type: Button
                  action: player.togglePlayPause
                  visible: ${player.isPlaying}
                  children:
                    - type: Icon
                      class: [transportKey]
                      name: pause.fill
                      size: 20
                      circle: true
                      padding: 14
                - type: Button
                  action: player.togglePlayPause
                  visible: ${player.isPaused}
                  children:
                    - type: Icon
                      class: [transportKey]
                      name: play.fill
                      size: 20
                      circle: true
                      padding: 14
                - type: Button
                  action: player.next
                  children:
                    - type: Icon
                      class: [onArtDim]
                      name: forward.fill
                      size: 18
