# The preview screen — the M3 proof: this file is a working mini-player.
# Artwork, transport buttons, and a seek slider, all from bindings and
# named actions: `value: ${player.progress}` reads state, `action:
# player.seek` sends the dragged position as its argument, and
# `visible: ${player.hasTrack}` keeps the transport with a track.

root:
  type: Container
  class: [chrome]
  padding: 24
  cornerRadius: 16
  children:
    - type: VStack
      spacing: 18
      alignment: center
      children:
        - type: Artwork
          url: ${player.artworkURL}
          size: 96
          cornerRadius: 12

        - type: Text
          text: Config-Driven UI
          fontSize: 22
          fontWeight: semibold
          color: "#F2F2F5"

        - type: Text
          text: Edit this file, the window follows.
          fontSize: 13
          color: "#8A8A96"

        - type: HStack
          spacing: 14
          alignment: center
          visible: ${player.hasTrack}
          children:
            - type: Button
              action: player.previous
              children:
                - type: Text
                  text: ◀
                  fontSize: 15
                  color: "#F2F2F5"
            - type: Button
              action: player.togglePlayPause
              children:
                - type: Text
                  text: ❚❚
                  fontSize: 15
                  color: "#E8567A"
            - type: Button
              action: player.next
              children:
                - type: Text
                  text: ▶▶
                  fontSize: 15
                  color: "#F2F2F5"

        - type: ProgressSlider
          value: ${player.progress}
          duration: ${player.duration}
          action: player.seek
          color: "#E8567A"

        - type: HStack
          spacing: 8
          alignment: center
          children:
            - type: SpectrumBars
              barWidth: 5
              barHeight: 24
              spacing: 7
              color: "#E8567A"

        - type: HStack
          spacing: 16
          alignment: center
          children:
            - type: Text
              text: .config/kumone/screens
              fontSize: 11
              color: "#5C5C66"
            - type: Spacer
            - type: Text
              text: M3
              fontSize: 11
              color: "#5C5C66"
