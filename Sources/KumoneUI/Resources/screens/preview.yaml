# The preview screen — cover-first. The whole window is made of its own
# music: the album art fills it blurred and darkened as the backdrop, the
# real cover sits large above the words, and controls are quiet so the
# image carries the page. That is what a player looks like; a plain dark
# panel with glyphs on it is a wireframe of one.

window:
  width: 400
  height: 560
  minWidth: 344
  minHeight: 480
  title: Kumone

root:
  type: ZStack
  children:
    - type: BackdropArtwork
      url: ${player.artworkURL}
      blur: 36
      dim: 0.50
      cornerRadius: 16

    - type: Container
      class: [glass]
      children:
        - type: VStack
          spacing: 20
          alignment: center
          children:
            # The subject: a cover big enough to be the first thing
            # anyone sees.
            - type: Artwork
              url: ${player.artworkURL}
              size: 200
              cornerRadius: 12

            - type: Text
              class: [title]
              text: ${player.title}
            - type: Text
              class: [onArtMeta]
              text: ${player.artist}

            # Times outside the rail, the whole bar the target.
            - type: HStack
              spacing: 12
              alignment: center
              children:
                - type: Text
                  class: [onArtDim]
                  text: ${player.progressClock}
                - type: ProgressSlider
                  class: [seek]
                  value: ${player.progress}
                  duration: ${player.duration}
                  action: player.seek
                - type: Text
                  class: [onArtDim]
                  text: ${player.durationClock}

            # Two quiet keys around one loud one.
            - type: HStack
              spacing: 44
              alignment: center
              children:
                - type: Button
                  action: player.previous
                  children:
                    - type: Icon
                      class: [onArtDim]
                      name: backward.fill
                      size: 18
                - type: Button
                  action: player.togglePlayPause
                  visible: ${player.isPlaying}
                  children:
                    - type: Icon
                      class: [transportKey]
                      name: pause.fill
                      size: 20
                      circle: true
                      padding: 14
                - type: Button
                  action: player.togglePlayPause
                  visible: ${player.isPaused}
                  children:
                    - type: Icon
                      class: [transportKey]
                      name: play.fill
                      size: 20
                      circle: true
                      padding: 14
                - type: Button
                  action: player.next
                  children:
                    - type: Icon
                      class: [onArtDim]
                      name: forward.fill
                      size: 18

            # One navigation affordance, plain words.
            - type: HStack
              spacing: 6
              alignment: leading
              children:
                - type: Button
                  action: app.presentScreen
                  argument: lyrics
                  children:
                    - type: HStack
                      spacing: 6
                      children:
                        - type: Icon
                          class: [nav]
                          name: quote.bubble
                          size: 11
                        - type: Text
                          class: [nav]
                          text: Lyrics
