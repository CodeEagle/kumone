# The preview screen — a night-listening card. Cover art carries it:
# everything else is quiet, left-aligned like an album sleeve, with one
# accent colour saved for the living parts (play glyph, seek fill).

window:
  width: 400
  height: 520
  minWidth: 340
  minHeight: 440
  title: Kumone

root:
  type: Container
  class: [chrome]
  children:
    - type: VStack
      spacing: 22
      alignment: leading
      children:
        # Sleeve row: the art is the subject, the words sit beside it.
        - type: HStack
          spacing: 14
          alignment: center
          children:
            - type: Artwork
              url: ${player.artworkURL}
              size: 64
              cornerRadius: 10
            - type: VStack
              spacing: 4
              alignment: leading
              children:
                - type: Text
                  class: [title]
                  text: ${player.title}
                - type: Text
                  class: [meta]
                  text: ${player.artist}

        # Transport: one column of physical-deck buttons, centred.
        - type: HStack
          spacing: 34
          alignment: center
          visible: ${player.hasTrack}
          children:
            - type: Button
              action: player.previous
              children:
                - type: Icon
                  class: [transportSide]
                  name: backward.fill
                  size: 18
            - type: Button
              action: player.togglePlayPause
              visible: ${player.isPlaying}
              children:
                - type: Icon
                  class: [transportMain]
                  name: pause.fill
                  size: 22
            - type: Button
              action: player.togglePlayPause
              visible: ${player.isPaused}
              children:
                - type: Icon
                  class: [transportMain]
                  name: play.fill
                  size: 22
            - type: Button
              action: player.next
              children:
                - type: Icon
                  class: [transportSide]
                  name: forward.fill
                  size: 18

        # The whole width is the seek target, times at both ends.
        - type: HStack
          spacing: 10
          alignment: center
          children:
            - type: Text
              class: [caption]
              text: ${player.progressClock}
            - type: ProgressSlider
              class: [seek]
              value: ${player.progress}
              duration: ${player.duration}
              action: player.seek
            - type: Text
              class: [caption]
              text: ${player.durationClock}

        # Live spectrum, small, under the seek: this window moves with
        # the music without anything else on screen trying to.
        - type: SpectrumBars
          barWidth: 4
          barHeight: 18
          spacing: 6
          color: "#2F3846"

        # One navigation affordance, plain words, no arrow flourish.
        - type: HStack
          spacing: 6
          alignment: leading
          children:
            - type: Button
              action: app.presentScreen
              argument: lyrics
              children:
                - type: HStack
                  spacing: 6
                  children:
                    - type: Icon
                      class: [nav]
                      name: quote.bubble
                      size: 11
                    - type: Text
                      class: [nav]
                      text: Lyrics
