# The default keymap: shortcut → named action. The actions are the same
# verbs a screen's `action:` prop uses, so rebinding here is rebinding
# the app — no recompile, and the file watcher picks up edits live.
# Drop a copy in ~/.config/kumone/screens/keymap.yaml to override.
# Delete every line there to disable all shortcuts.

space: player.togglePlayPause
escape: app.dismissNowPlaying
rightarrow: player.next
leftarrow: player.previous
cmd+l: player.toggleLyricsPanel
cmd+shift+q: player.toggleQueuePanel

# The physical media keys. They arrive as systemDefined events and are
# nameable like any other key; volume keys stay unbound by default so the
# system keeps them, and cmd+shift+up/down steps volume instead.

media-play: player.togglePlayPause
media-next: player.next
media-previous: player.previous
cmd+shift+uparrow: player.volumeUp
cmd+shift+downarrow: player.volumeDown
