# "Deep water" — the alternate theme, so switching means something
# visible. Same design, cold side of the wheel: a teal-tinted darkness
# with a mist-cyan accent. Mirrors the default file one rule for one
# rule; anything else changes the design, not the palette.

tokens:
  canvas:    "#0B151F"
  surface:   "#122130"
  text:      "#E6EEF4"
  textSub:   "#7E94A8"
  accent:    "#7FC6D4"
  hairline:  "#1E3140"

styles:
  chrome:
    background: token(canvas)
    cornerRadius: 14
    padding: 22

  title:        { color: token(text),    fontSize: 20, fontWeight: semibold }
  meta:         { color: token(textSub), fontSize: 13 }
  caption:      { color: token(textSub), fontSize: 11 }
  rowTitle:     { color: token(text),    fontSize: 13 }
  rowMeta:      { color: token(textSub), fontSize: 11 }
  lyricActive:  { color: token(text),    fontSize: 15 }
  lyricInactive: { color: "#52677A",      fontSize: 15 }

  seek:         { color: token(accent) }
  transportMain: { color: token(accent) }
  transportSide: { color: token(textSub) }
  nav:          { color: token(accent), fontSize: 11 }
