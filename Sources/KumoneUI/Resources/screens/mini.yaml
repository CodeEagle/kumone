# A second screen, to prove a screen is just a file: `preview.yaml` opens
# this one through the `app.presentScreen` verb, with the name riding as
# the button's `argument`. Add your own screens the same way — anything
# in the screens directory is one.

# A screen also declares the window it wants to open in: open it again
# after editing this block and the window takes the new geometry.
window:
  width: 400
  height: 620
  minWidth: 320
  minHeight: 480
  title: Mini

root:
  type: Container
  class: [chrome]
  padding: 24
  cornerRadius: 16
  children:
    - type: VStack
      spacing: 16
      alignment: center
      children:
        - type: Text
          text: A Second Screen
          fontSize: 20
          fontWeight: bold
          color: "#5FD0E8"

        - type: Text
          text: ${player.title}
          fontSize: 14
          color: "#8A8A96"

        - type: HStack
          spacing: 14
          alignment: center
          children:
            - type: Button
              action: player.togglePlayPause
              children:
                - type: Text
                  text: ❚❚
                  fontSize: 15
                  color: "#E8567A"
            - type: Button
              action: player.next
              children:
                - type: Text
                  text: ▶▶
                  fontSize: 15
                  color: "#F2F2F5"

        - type: Text
          text: Edit this file; the window follows.
          fontSize: 11
          color: "#5C5C66"

        # A theme switcher in four lines of config: the list of theme names
        # is a binding, each becomes a button whose argument is the name,
        # and the verb does the switch. Works for any list of strings.
        - type: ForEach
          items: ${app.themeNames}
          spacing: 14
          children:
            - type: Button
              action: app.setTheme
              argument: ${item}
              children:
                - type: Text
                  text: ${item}
                  fontSize: 11
                  color: "#5FD0E8"

        - type: Text
          text: Up next
          fontSize: 11
          fontWeight: semibold
          color: "#8A8A96"

        # A collection consumed, not declared: the list comes from a
        # binding, and the child beneath is the stamp repeated per item —
        # `item.` in the stamp sees that copy's element.
        - type: ForEach
          items: ${player.upcomingTracks}
          spacing: 10
          children:
            - type: HStack
              spacing: 10
              children:
                - type: Artwork
                  url: ${item.artworkURL}
                  size: 32
                  cornerRadius: 6
                - type: Text
                  text: ${item.title}
                  fontSize: 13
                  color: "#F2F2F5"
