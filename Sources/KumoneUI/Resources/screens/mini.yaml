# The mini player — same card, taller: it also carries the queue and the
# theme switcher. Any YAML in the screens directory is a screen; this one
# is what `app.presentScreen` opens from the preview's Lyrics button and
# what a user copies as the starting point for their own.

window:
  width: 400
  height: 620
  minWidth: 340
  minHeight: 480
  title: Kumone

root:
  type: Container
  class: [chrome]
  children:
    - type: VStack
      spacing: 20
      alignment: leading
      children:
        - type: HStack
          spacing: 14
          alignment: center
          children:
            - type: Artwork
              url: ${player.artworkURL}
              size: 72
              cornerRadius: 10
            - type: VStack
              spacing: 4
              alignment: leading
              children:
                - type: Text
                  class: [title]
                  text: ${player.title}
                - type: Text
                  class: [meta]
                  text: ${player.artist}

        - type: HStack
          spacing: 10
          alignment: center
          children:
            - type: Text
              class: [caption]
              text: ${player.progressClock}
            - type: ProgressSlider
              class: [seek]
              value: ${player.progress}
              duration: ${player.duration}
              action: player.seek
            - type: Text
              class: [caption]
              text: ${player.durationClock}

        - type: HStack
          spacing: 34
          alignment: center
          children:
            - type: Button
              action: player.previous
              children:
                - type: Icon
                  class: [transportSide]
                  name: backward.fill
                  size: 18
            - type: Button
              action: player.togglePlayPause
              visible: ${player.isPlaying}
              children:
                - type: Icon
                  class: [transportMain]
                  name: pause.fill
                  size: 22
            - type: Button
              action: player.togglePlayPause
              visible: ${player.isPaused}
              children:
                - type: Icon
                  class: [transportMain]
                  name: play.fill
                  size: 22
            - type: Button
              action: player.next
              children:
                - type: Icon
                  class: [transportSide]
                  name: forward.fill
                  size: 18

        - type: Text
          class: [caption]
          text: Up next

        # A collection consumed, not declared: the queue comes from a
        # binding, each row is the same stamp, and `item.` inside sees
        # that copy's element.
        - type: ForEach
          items: ${player.upcomingTracks}
          spacing: 12
          children:
            - type: HStack
              spacing: 12
              alignment: center
              children:
                - type: Artwork
                  url: ${item.artworkURL}
                  size: 36
                  cornerRadius: 7
                - type: Text
                  class: [rowTitle]
                  text: ${item.title}

        # Theme switcher: two plain words, either one re-skins every
        # screen live through the app.setTheme verb.
        - type: HStack
          spacing: 18
          alignment: leading
          children:
            - type: Button
              action: app.setTheme
              argument: default
              children:
                - type: Text
                  class: [caption]
                  text: Vinyl night
            - type: Button
              action: app.setTheme
              argument: aurora
              children:
                - type: Text
                  class: [caption]
                  text: Deep water
